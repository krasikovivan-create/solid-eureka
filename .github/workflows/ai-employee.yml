name: ai-employee

on:
  push:
    paths: ["ai-employee/**", ".github/workflows/ai-employee.yml"]
  pull_request:
    paths: ["ai-employee/**", ".github/workflows/ai-employee.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-employee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-employee/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Docker image builds
        run: docker build -t ai-employee .

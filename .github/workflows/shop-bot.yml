name: shop-bot

on:
  push:
    paths: ["shop-bot/**", ".github/workflows/shop-bot.yml"]
  pull_request:
    paths: ["shop-bot/**", ".github/workflows/shop-bot.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop-bot
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shop-bot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://shop:shop@localhost:5432/shop_test
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: postgresql://shop:shop@localhost:5432/shop_test
        run: |
          psql postgresql://shop:shop@localhost:5432/shop_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic check

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat/package-lock.json
      - name: Build chat app
        working-directory: chat
        env:
          # Address of the deployed chat server (Settings → Secrets and variables → Actions → Variables).
          VITE_SERVER_URL: ${{ vars.CHAT_SERVER_URL }}
        run: |
          npm ci
          npm run build
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons .nojekyll ai-academy _site/
          cp -r chat/dist _site/chat
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

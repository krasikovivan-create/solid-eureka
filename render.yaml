# Render Blueprint: the «Связь» chat server (chat/server) and the Telegram bot (telegram-bot).
# Render → New → Blueprint → pick this repository → Apply.
services:
  - type: web
    name: svyaz-server
    runtime: node
    plan: free
    rootDir: chat/server
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Only the published app may connect (add more origins separated by commas).
      - key: ALLOWED_ORIGINS
        value: https://krasikovivan-create.github.io
      # Optional TURN relay for calls between networks that block direct connections.
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  # Telegram helper bot (telegram-bot/). Fill BOT_TOKEN after Apply; see telegram-bot/README.md.
  - type: web
    name: telegram-helper-bot
    runtime: node
    plan: free
    rootDir: telegram-bot
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Token from @BotFather.
      - key: BOT_TOKEN
        sync: false
      - key: BOT_TZ
        value: Europe/Moscow
      # Your Telegram id (from @userinfobot) — unlocks /stats.
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      # The free plan has no disk: without Upstash, notes and reminders vanish on every restart.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

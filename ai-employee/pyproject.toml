[project]
name = "ai-employee"
version = "1.0.0"
description = "Виртуальный сотрудник в Telegram: задачи, клиенты, аудит процессов, КП, база знаний"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках — это нормально
    "RUF002",
    "RUF003",
    "B008",
    "SIM105",
    "SIM905",  # список окончаний удобнее читать строкой
    "E501",    # длину кода держит ruff format; длинные строки-тексты допустимы
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимы синхронные проверки файлов и сигнатуры как у aiogram.
"tests/*" = ["ASYNC109", "ASYNC240"]
